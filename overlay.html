<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipArc</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        pointer-events: none;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .clip-item {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.25));
        transform-origin: center;
        max-width: 240px;
        max-height: 200px;
      }
      .clip-item.image {
        max-width: none;
        max-height: none;
      }
      .clip-item.text {
        background: linear-gradient(135deg, rgba(79, 70, 229, 0.95), rgba(59, 130, 246, 0.9));
        color: #f9fbff;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        font-size: 14px;
        line-height: 1.4;
      }
      .clip-item.text .hint {
        display: block;
        font-size: 11px;
        opacity: 0.8;
        margin-top: 6px;
      }
      .clip-item.image img {
        width: 100%;
        height: auto;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.6);
      }
      .folder {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 64px;
        height: 48px;
        background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHJlY3Qgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNCIgZmlsbD0iI2Y1OWUwYiIvPjxwYXRoIGZpbGw9IiNmZmZmZmYiIGQ9Ik0xOSwzSDE0LjgyQTMsMyAwIDAsMCAxMiwxQTMsMyAwIDAsMCA5LjE4LDNINUEyLDIgMCAwLDAgMyw1VjIxQTIsMiAwIDAsMCA1LDIzSDE5QTIsMiAwIDAsMCAyMSwyMVY1QTIsMiAwIDAsMCAxOSwzTTEyLDNBMSwxIDAgMCwxIDEzLDRBMSwxIDAgMCwxIDEyLDVBMSwxIDAgMCwxIDExLDRBMSwxIDAgMCwxIDEyLDNNMTksMjFINVY1SDdWN0gxN1Y1SDE5VjIxWiIvPjwvc3ZnPg==")
          center center / contain no-repeat;
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.2));
        transform: translate(
            calc(-50% + var(--folder-x, 100px)),
            calc(-50% + var(--folder-y, 10px))
          );
        opacity: 0.95;
      }
      .folder.checked {
        background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHJlY3Qgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiByeD0iNCIgZmlsbD0iIzM0ZDM5OSIvPjxwYXRoIGZpbGw9IiNmZmZmZmYiIGQ9Ik0xOSwzSDE0LjgyQTMsMyAwIDAsMCAxMiwxQTMsMyAwIDAsMCA5LjE4LDNINUEyLDIgMCAwLDAgMyw1VjIxQTIsMiAwIDAsMCA1LDIzSDE5QTIsMiAwIDAsMCAyMSwyMVY1QTIsMiAwIDAsMCAxOSwzTTEyLDNBMSwxIDAgMCwxIDEzLDRBMSwxIDAgMCwxIDEyLDVBMSwxIDAgMCwxIDExLDRBMSwxIDAgMCwxIDEyLDNNMTksMjFINVY1SDdWN0gxN1Y1SDE5VjIxWiIvPjxwYXRoIGZpbGw9IiNmZmZmZmYiIGQ9Ik05LDE2LjE3TDQuODMsMTJMMy40MSwxMy40MUw5LDE5TDIxLDdMMTkuNTksNS41OUw5LDE2LjE3WiIgdHJhbnNmb3JtPSJ0cmFuc2xhdGUoLTQsLTIpIHNjYWxlKDAuNikiLz48cGF0aCBmaWxsPSIjZmZmZmZmIiBkPSJNOSwxNi4xN0w0LjgzLDEyTDMuNDEsMTMuNDFMOSwxOUwyMSw3TDE5LjU5LDUuNTlMOSwxNi4xN1oiIHRyYW5zZm9ybT0idHJhbnNsYXRlKDQsLTIpIHNjYWxlKDAuNikiLz48L3N2Zz4=")
          center center / contain no-repeat;
      }
    </style>

  <body>

</html>
